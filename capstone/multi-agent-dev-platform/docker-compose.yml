services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    volumes:
      - kb_data:/app/knowledge_db
      - logs_data:/app/logs
      - runs_data:/app/runs
      - generated_data:/app/generated_projects
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

  monitor:
    build: .
    command: streamlit run ui/monitoring.py --server.port 8502 --server.address 0.0.0.0
    ports:
      - "8502:8502"
    env_file: .env
    volumes:
      - logs_data:/app/logs
    depends_on:
      - api

volumes:
  kb_data:
  logs_data:
  runs_data:
  generated_data:
